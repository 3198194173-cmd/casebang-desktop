appId: com.casebang.automation
productName: CASEBANG 表格编码自动化
copyright: Copyright © CASEBANG
directories:
  output: release
electronDist: node_modules/electron/dist
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
extraResources:
  - from: resources/casebang-app-icon.png
    to: casebang-app-icon.png
  - from: resources/generated-product-template.xlsx
    to: generated-product-template.xlsx
win:
  executableName: CASEBANG-Automation
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CASEBANG 表格编码自动化
  menuCategory: CASEBANG
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
